version: '3.8'

services:
  cos-mcp:
    build: .
    container_name: cos-mcp-server
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - Region=${Region}
      - Bucket=${Bucket}
      - SecretId=${SecretId}
      - SecretKey=${SecretKey}
      - DatasetName=${DatasetName:-}
    env_file:
      - .env
    volumes:
      # 如果需要上传本地文件,可以挂载目录
      - ./uploads:/app/uploads
    networks:
      - cos-mcp-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  cos-mcp-network:
    driver: bridge
